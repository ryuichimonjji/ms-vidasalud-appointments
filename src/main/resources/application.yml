server:
  port: 8081

spring:
  application:
    name: ms-vidasalud-appointments
  datasource:
    url: jdbc:h2:mem:vidasalud
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
rabbitmq:
  exchange: vidasalud.appointments.exchange
  queue:
    notify: vidasalud.notify.queue
  routing-key:
    created: appointment.created
    status-changed: appointment.status.changed
  dlx: vidasalud.appointments.dlx
  dlq: vidasalud.notify.dlq
  host: localhost
  port: 5672
  username: guest
  password: guest